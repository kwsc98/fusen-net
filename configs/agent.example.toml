version = 2

[agent]
node_id = "edge-a"
tun_name = "stellaris0"

[coordinator]
enrollment_addr = "127.0.0.1:7000"
control_addr = "127.0.0.1:7001"
relay_addr = "127.0.0.1:7002"
server_name = "localhost"
deployment_ca_file = "certs/deployment-ca.pem"

[identity]
directory = "state/edge-a"
enrollment_token_file = "secrets/edge-a.token"

[p2p]
bind = "0.0.0.0:7100"
idle_timeout_secs = 300

