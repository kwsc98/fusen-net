[workspace]
members = ["fusen-net", "examples"]
resolver = "2"

[workspace.package]
version = "0.0.1"
authors = ["kwsc98 <kwsc98@gmail.com>"]
edition = "2021"
license = "Apache-2.0"
description = "FusenNet"


[workspace.dependencies]
fusen-net = { path = "fusen-net" }
fusen-common = "0.7.5"
#网络协议处理
tokio = { version = "1.42.0", features = ["sync"] }
bytes = "1.9.0"
hyper-util = "0.1.10"
futures = "0.3.31"
s2n-quic = "1.51.0"
quinn = { version = "0.11.6", features = ["runtime-tokio"] }
rustls = "0.23.20" 
rcgen = "0.13.2"
libc = "0.2.169"
base64 = "0.22.1"


#日志处理
tracing = "0.1.41"
tracing-futures = { version = "0.2.5" }
tracing-subscriber = "0.3.19"
pretty_env_logger = "0.5.0"

#json序列化
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
pnet = "0.35.0"
uuid = { version = "1.11.0", features = ["v4"] }
