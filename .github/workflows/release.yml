name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAMESPACE: ghcr.io/kwsc98/stellaris

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.verified_tag.outputs.commit }}
      is_stable: ${{ steps.release.outputs.is_stable }}
      release_channel: ${{ steps.release.outputs.release_channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify signed tag and main ancestry
        id: verified_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag || {
            echo "release tag must be an annotated signed tag" >&2
            exit 1
          }
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_payload="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          verified="$(jq -r '.verification.verified' <<<"$tag_payload")"
          test "$verified" = true || {
            echo "GitHub did not verify the release tag signature" >&2
            exit 1
          }
          test "$(jq -r '.object.type' <<<"$tag_payload")" = commit || {
            echo "release tag must point directly to a commit" >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(jq -r '.object.sha' <<<"$tag_payload")"
          test "$(git rev-parse HEAD)" = "$release_commit" || {
            echo "checked-out tag does not match the verified tag commit" >&2
            exit 1
          }
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "release tag commit is not reachable from origin/main" >&2
            exit 1
          }
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Match tag to Cargo package version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          package_version="$({ cargo metadata --locked --no-deps --format-version 1; } \
            | jq -r '.packages[] | select(.name == "stellaris-cli") | .version')"
          test "v${package_version}" = "$tag" || {
            echo "tag $tag does not match stellaris-cli version $package_version" >&2
            exit 1
          }

          changelog_prefix="## [${package_version}] - "
          changelog_count="$(grep -Fc "$changelog_prefix" CHANGELOG.md || true)"
          test "$changelog_count" -eq 1 || {
            echo "CHANGELOG.md must contain exactly one dated section for $package_version" >&2
            exit 1
          }
          changelog_heading="$(grep -F "$changelog_prefix" CHANGELOG.md)"
          changelog_date="${changelog_heading#"$changelog_prefix"}"
          [[ "$changelog_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "CHANGELOG.md section for $package_version must use YYYY-MM-DD" >&2
            exit 1
          }

          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_stable=true
            release_channel=stable
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            is_stable=false
            release_channel="${BASH_REMATCH[1]}"
          else
            echo "release tag must be vX.Y.Z or vX.Y.Z-{alpha,beta,rc}[.N], got: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check patch whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Check documentation contracts and local links
        shell: bash
        run: bash scripts/check-docs.sh

      - name: Test documentation governance checkers
        run: |
          ruby scripts/test-pr-design-contract.rb
          ruby scripts/test-release-evidence.rb
          ruby scripts/test-release-workflow.rb

      - name: Check stable release evidence
        env:
          IS_STABLE: ${{ steps.release.outputs.is_stable }}
          RELEASE_COMMIT: ${{ steps.verified_tag.outputs.commit }}
        run: ruby scripts/check-release-evidence.rb

      - name: Run release Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run release tests
        run: cargo test --workspace --all-features --locked

      - name: Run protocol decoder fuzz smoke
        run: >-
          cargo test -p stellaris --lib --locked
          protocol::tests::arbitrary_input_is_handled_without_panicking -- --exact

      - name: Build release documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Check each transport feature in isolation
        shell: bash
        run: |
          for feature in backend-quinn backend-s2n backend-gm-quic; do
            cargo check -p stellaris --all-targets --locked \
              --no-default-features --features "$feature"
            cargo check -p stellaris-cli --all-targets --locked \
              --no-default-features --features "$feature"
          done

      - name: Validate vendored transport patches
        shell: bash
        run: |
          for manifest in \
            vendor/qunreliable/Cargo.toml \
            vendor/qconnection/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --manifest-path "$manifest" \
              --all-targets --locked -- -D warnings
            cargo test --manifest-path "$manifest" --locked
          done

  policy:
    name: Validate dependency policy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  real-tun-linux:
    name: Stable gate / Linux real TUN
    needs: validate
    if: needs.validate.outputs.is_stable == 'true'
    runs-on: [self-hosted, Linux, X64, stellaris-tun]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0

      - name: Run stable real TUN gate
        run: bash tests/e2e/run-real-tun.sh linux all

  release-gate:
    name: Resolve release qualification
    needs: [validate, policy, real-tun-linux]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.validate.outputs.tag }}
      commit: ${{ needs.validate.outputs.commit }}
      is_stable: ${{ needs.validate.outputs.is_stable }}
      release_channel: ${{ needs.validate.outputs.release_channel }}
    env:
      IS_STABLE: ${{ needs.validate.outputs.is_stable }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      LINUX_TUN_RESULT: ${{ needs.real-tun-linux.result }}
    steps:
      - name: Enforce release gates
        shell: bash
        run: |
          if [[ "$VALIDATE_RESULT" != success || "$POLICY_RESULT" != success ]]; then
            echo "validation or dependency policy gate failed" >&2
            exit 1
          fi

          if [[ "$IS_STABLE" == true ]]; then
            if [[ "$LINUX_TUN_RESULT" != success ]]; then
              echo "the complete Linux v2 real-TUN gate must pass before a stable release" >&2
              exit 1
            fi
            echo "stable release qualified by the Linux v2 real-TUN gate"
          else
            echo "::warning::prerelease publication skips the stable Linux real-TUN gate"
          fi

  build:
    name: Package / ${{ matrix.target }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-gate.outputs.commit }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: >-
          cargo build -p stellaris-cli --bin stellaris --release --locked
          --target ${{ matrix.target }} --no-default-features --features backend-quinn

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/stellaris" dist/package/stellaris
          cp README.md LICENSE-APACHE LICENSE-MIT dist/package/
          tar -C dist/package -czf "dist/stellaris-${{ needs.release-gate.outputs.tag }}-${{ matrix.target }}.tar.gz" .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/stellaris.exe" dist/package/
          Copy-Item "target/${{ matrix.target }}/release/wintun.dll" dist/package/
          Copy-Item README.md, LICENSE-APACHE, LICENSE-MIT dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/stellaris-${{ needs.release-gate.outputs.tag }}-${{ matrix.target }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stellaris-${{ matrix.target }}
          path: dist/stellaris-*
          if-no-files-found: error

  publication-preflight:
    name: Refuse existing release destinations
    needs: [release-gate, build]
    runs-on: ubuntu-latest
    permissions:
      # Write visibility is required for draft releases; this job only issues GETs.
      contents: write
      packages: read
    steps:
      - name: Require unused GitHub Release and GHCR tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          set -euo pipefail

          release_response="${RUNNER_TEMP}/stellaris-release-preflight.json"
          if ! release_status="$(
            curl --silent --show-error --location \
              --output "$release_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"; then
            echo "could not determine whether GitHub Release ${RELEASE_TAG} exists" >&2
            exit 1
          fi
          case "$release_status" in
            404)
              echo "GitHub Release ${RELEASE_TAG} is unused"
              ;;
            200)
              release_id="$(jq -r '.id // "unknown"' "$release_response")"
              asset_names="$(jq -r '[.assets[]?.name] | if length == 0 then "none" else join(", ") end' "$release_response")"
              echo "GitHub Release ${RELEASE_TAG} already exists (id=${release_id}; assets=${asset_names})" >&2
              exit 1
              ;;
            *)
              echo "GitHub Release lookup returned unexpected HTTP ${release_status}" >&2
              exit 1
              ;;
          esac

          case "$IMAGE_NAMESPACE" in
            ghcr.io/*) image_prefix="${IMAGE_NAMESPACE#ghcr.io/}" ;;
            *) echo "IMAGE_NAMESPACE must use ghcr.io" >&2; exit 1 ;;
          esac

          for component in server agent; do
            image_repository="${image_prefix}/${component}"
            token_response="${RUNNER_TEMP}/stellaris-ghcr-${component}-token.json"
            if ! token_status="$(
              curl --silent --show-error --location \
                --output "$token_response" \
                --write-out '%{http_code}' \
                --user "${GITHUB_ACTOR}:${GH_TOKEN}" \
                --get \
                --data-urlencode "scope=repository:${image_repository}:pull" \
                'https://ghcr.io/token'
            )"; then
              echo "could not obtain a GHCR read token for ${image_repository}" >&2
              exit 1
            fi
            test "$token_status" = 200 || {
              echo "GHCR token lookup for ${image_repository} returned HTTP ${token_status}" >&2
              exit 1
            }
            registry_token="$(jq -er '.token | select(type == "string" and length > 0)' "$token_response")" || {
              echo "GHCR returned no read token for ${image_repository}" >&2
              exit 1
            }

            manifest_response="${RUNNER_TEMP}/stellaris-ghcr-${component}-manifest.json"
            if ! manifest_status="$(
              curl --silent --show-error --location \
                --output "$manifest_response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${registry_token}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${image_repository}/manifests/${RELEASE_TAG}"
            )"; then
              echo "could not determine whether ${image_repository}:${RELEASE_TAG} exists" >&2
              exit 1
            fi
            case "$manifest_status" in
              404)
                echo "GHCR tag ${image_repository}:${RELEASE_TAG} is unused"
                ;;
              200)
                echo "GHCR tag ${image_repository}:${RELEASE_TAG} already exists" >&2
                exit 1
                ;;
              *)
                echo "GHCR manifest lookup for ${image_repository}:${RELEASE_TAG} returned unexpected HTTP ${manifest_status}" >&2
                exit 1
                ;;
            esac
          done

  container:
    name: Publish Linux containers
    needs: [release-gate, build, publication-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    outputs:
      server_digest: ${{ steps.server_build.outputs.digest }}
      agent_digest: ${{ steps.agent_build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-gate.outputs.commit }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image metadata
        id: server_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/server
          tags: |
            type=raw,value=${{ needs.release-gate.outputs.tag }}

      - name: Build and publish server image
        id: server_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ needs.release-gate.outputs.tag }}
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Agent image metadata
        id: agent_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/agent
          tags: |
            type=raw,value=${{ needs.release-gate.outputs.tag }}

      - name: Build and publish agent image
        id: agent_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ needs.release-gate.outputs.tag }}
          tags: ${{ steps.agent_meta.outputs.tags }}
          labels: ${{ steps.agent_meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  github-release:
    name: Publish GitHub release
    needs: [build, container, publication-preflight, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-gate.outputs.commit }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stellaris-*
          path: dist
          merge-multiple: true

      - name: Generate third-party license inventory
        shell: bash
        run: |
          cargo install cargo-license --version 0.6.1 --locked
          cargo license --avoid-dev-deps --json \
            | jq --sort-keys 'sort_by(.name, .version)' \
            > dist/THIRD-PARTY-LICENSES.json

      - name: Record published container digests
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
          SERVER_DIGEST: ${{ needs.container.outputs.server_digest }}
          AGENT_DIGEST: ${{ needs.container.outputs.agent_digest }}
        run: |
          printf '%s\n' \
            "${IMAGE_NAMESPACE}/server:${RELEASE_TAG}@${SERVER_DIGEST}" \
            "${IMAGE_NAMESPACE}/agent:${RELEASE_TAG}@${AGENT_DIGEST}" \
            > dist/CONTAINER-DIGESTS.txt

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/stellaris.spdx.json

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Write release qualification notice
        shell: bash
        env:
          IS_STABLE: ${{ needs.release-gate.outputs.is_stable }}
          RELEASE_CHANNEL: ${{ needs.release-gate.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          if [[ "$IS_STABLE" == true ]]; then
            printf '%s\n' \
              '## Release qualification' \
              '' \
              'The privileged Linux Quinn v2 real-TUN gate passed on this tagged commit. macOS and Windows artifacts are compile-only and have not passed a real-TUN release gate.' \
              'The s2n-quic and gm-quic transport features are compile-checked only and are not qualified v2 runtime backends.' \
              > release-qualification.md
          else
            printf '%s\n' \
              '## Pre-release limitations' \
              '' \
              "This ${RELEASE_CHANNEL} build is an early preview. The privileged Linux Quinn v2 real-TUN gate is not required for prerelease publication and was skipped by this workflow. macOS and Windows artifacts are compile-only and have not passed a real-TUN release gate. Do not use this build for critical production traffic." \
              '' \
              'The s2n-quic and gm-quic transport features are compile-checked only and are not qualified v2 runtime backends. The v2 runtime and real-TUN gate use Quinn.' \
              > release-qualification.md
          fi

          package_version="${RELEASE_TAG#v}"
          awk -v prefix="## [${package_version}] - " '
            index($0, prefix) == 1 { emit = 1 }
            emit && /^## / && index($0, prefix) != 1 { exit }
            emit { print }
          ' CHANGELOG.md > release-changelog.md
          test -s release-changelog.md

          {
            cat release-qualification.md
            printf '\n## Changelog\n\n'
            cat release-changelog.md
          } > release-body.md

      - name: Reconfirm the release tag has not moved
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.release-gate.outputs.commit }}
        run: |
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_payload="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          test "$(jq -r '.verification.verified' <<<"$tag_payload")" = true
          test "$(jq -r '.object.type' <<<"$tag_payload")" = commit
          current_commit="$(jq -r '.object.sha' <<<"$tag_payload")"
          test "$current_commit" = "$EXPECTED_COMMIT" || {
            echo "release tag moved after validation" >&2
            exit 1
          }

      - name: Reconfirm the GitHub Release is still unused
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          response="${RUNNER_TEMP}/stellaris-release-recheck.json"
          if ! status="$(
            curl --silent --show-error --location \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"; then
            echo "could not reconfirm whether GitHub Release ${RELEASE_TAG} exists" >&2
            exit 1
          fi
          test "$status" = 404 || {
            echo "GitHub Release ${RELEASE_TAG} appeared after preflight (HTTP ${status})" >&2
            exit 1
          }

      - name: Create and publish a new GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
          IS_PRERELEASE: ${{ needs.release-gate.outputs.is_stable != 'true' }}
          MAKE_LATEST: ${{ needs.release-gate.outputs.is_stable == 'true' }}
        run: |
          set -euo pipefail

          case "$IS_PRERELEASE:$MAKE_LATEST" in
            true:false|false:true) ;;
            *) echo "invalid release channel flags" >&2; exit 1 ;;
          esac

          api_message() {
            jq -r '
              if (.message? | type) == "string" then .message
              else "no API error message"
              end
            ' "$1" 2>/dev/null || printf '%s\n' "unparseable API response"
          }

          create_request="${RUNNER_TEMP}/stellaris-release-create-request.json"
          create_response="${RUNNER_TEMP}/stellaris-release-create-response.json"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$IS_PRERELEASE" \
            --rawfile body release-body.md \
            '{
              tag_name: $tag,
              body: $body,
              draft: true,
              prerelease: $prerelease,
              generate_release_notes: true
            }' > "$create_request"

          if ! create_status="$(
            curl --silent --show-error \
              --output "$create_response" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@${create_request}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases"
          )"; then
            echo "could not create GitHub Release ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "$create_status" != 201 ]]; then
            echo "create-only GitHub Release request returned HTTP ${create_status}: $(api_message "$create_response")" >&2
            exit 1
          fi

          release_id="$(
            jq -er --arg tag "$RELEASE_TAG" '
              select(.tag_name == $tag and .draft == true)
              | .id
              | select(type == "number" and . > 0)
            ' "$create_response"
          )" || {
            echo "GitHub returned an invalid create response for ${RELEASE_TAG}" >&2
            exit 1
          }
          upload_url="$(
            jq -er '
              .upload_url
              | select(type == "string")
              | sub("\\{.*$"; "")
              | select(length > 0)
            ' "$create_response"
          )" || {
            echo "GitHub returned no upload URL for release ${release_id}" >&2
            exit 1
          }
          expected_upload_suffix="/releases/${release_id}/assets"
          [[ "$upload_url" == *"$expected_upload_suffix" ]] || {
            echo "GitHub returned an upload URL for a different release" >&2
            exit 1
          }

          asset_list="${RUNNER_TEMP}/stellaris-release-assets.list"
          find dist -maxdepth 1 -type f -print0 | sort -z > "$asset_list"
          mapfile -d '' asset_paths < "$asset_list"
          if (( ${#asset_paths[@]} == 0 || ${#asset_paths[@]} > 99 )); then
            echo "release must contain between 1 and 99 top-level dist assets" >&2
            exit 1
          fi

          for index in "${!asset_paths[@]}"; do
            asset_path="${asset_paths[$index]}"
            asset_name="${asset_path##*/}"
            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"
            case "$asset_name" in
              *.tar.gz) content_type=application/gzip ;;
              *.zip) content_type=application/zip ;;
              *.json) content_type=application/json ;;
              *.txt|SHA256SUMS) content_type='text/plain; charset=utf-8' ;;
              *) content_type=application/octet-stream ;;
            esac

            upload_response="${RUNNER_TEMP}/stellaris-release-asset-${index}.json"
            if ! upload_status="$(
              curl --silent --show-error \
                --output "$upload_response" \
                --write-out '%{http_code}' \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Content-Type: ${content_type}" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --data-binary "@${asset_path}" \
                "${upload_url}?name=${encoded_name}"
            )"; then
              echo "could not upload release asset ${asset_name}" >&2
              exit 1
            fi
            if [[ "$upload_status" != 201 ]]; then
              echo "upload of ${asset_name} returned HTTP ${upload_status}: $(api_message "$upload_response")" >&2
              exit 1
            fi
            jq -e --arg name "$asset_name" '
              (.id | type == "number") and (.id > 0) and (.name == $name)
            ' "$upload_response" >/dev/null || {
              echo "GitHub returned an invalid upload response for ${asset_name}" >&2
              exit 1
            }
          done

          assets_response="${RUNNER_TEMP}/stellaris-release-assets.json"
          if ! assets_status="$(
            curl --silent --show-error \
              --output "$assets_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100"
          )"; then
            echo "could not verify assets for release ${release_id}" >&2
            exit 1
          fi
          if [[ "$assets_status" != 200 ]]; then
            echo "asset verification returned HTTP ${assets_status}: $(api_message "$assets_response")" >&2
            exit 1
          fi
          jq -e --argjson count "${#asset_paths[@]}" '
            type == "array" and length == $count
          ' "$assets_response" >/dev/null || {
            echo "release ${release_id} contains an unexpected asset count" >&2
            exit 1
          }
          for asset_path in "${asset_paths[@]}"; do
            asset_name="${asset_path##*/}"
            jq -e --arg name "$asset_name" '
              [.[] | select(.name == $name)] | length == 1
            ' "$assets_response" >/dev/null || {
              echo "release ${release_id} does not contain exactly one ${asset_name}" >&2
              exit 1
            }
          done

          finalize_request="${RUNNER_TEMP}/stellaris-release-finalize-request.json"
          finalize_response="${RUNNER_TEMP}/stellaris-release-finalize-response.json"
          jq -n \
            --arg make_latest "$MAKE_LATEST" \
            '{draft: false, make_latest: $make_latest}' \
            > "$finalize_request"
          if ! finalize_status="$(
            curl --silent --show-error \
              --output "$finalize_response" \
              --write-out '%{http_code}' \
              --request PATCH \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@${finalize_request}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          )"; then
            echo "could not publish GitHub Release ${release_id}" >&2
            exit 1
          fi
          if [[ "$finalize_status" != 200 ]]; then
            echo "publishing release ${release_id} returned HTTP ${finalize_status}: $(api_message "$finalize_response")" >&2
            exit 1
          fi
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            --argjson prerelease "$IS_PRERELEASE" '
              .id == $id and .tag_name == $tag and .draft == false
                and .prerelease == $prerelease
            ' "$finalize_response" >/dev/null || {
            echo "GitHub returned an invalid finalized release" >&2
            exit 1
          }
