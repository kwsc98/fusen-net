name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check Pull Request design contract
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${PR_BASE_SHA}:scripts/check-pr-design-contract.rb" 2>/dev/null; then
            base_checker_dir="$(mktemp -d)"
            trap 'rm -rf "${base_checker_dir}"' EXIT
            git show "${PR_BASE_SHA}:scripts/check-pr-design-contract.rb" \
              > "${base_checker_dir}/check-pr-design-contract.rb"
            git show "${PR_BASE_SHA}:scripts/docs_metadata.rb" \
              > "${base_checker_dir}/docs_metadata.rb"
            ruby "${base_checker_dir}/check-pr-design-contract.rb"
            ruby scripts/check-pr-design-contract.rb
          else
            echo "::notice::Bootstrapping PR contract enforcement; checker tests still run."
          fi

      - name: Test Pull Request design contract checker
        run: ruby scripts/test-pr-design-contract.rb

      - name: Test release evidence checker
        run: ruby scripts/test-release-evidence.rb

      - name: Test release workflow policy
        run: ruby scripts/test-release-workflow.rb

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Verify the committed lockfile
        shell: bash
        run: |
          test -f Cargo.lock
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Check patch whitespace
        shell: bash
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ -n "$PULL_REQUEST_BASE" ]]; then
            git diff --check "$PULL_REQUEST_BASE"...HEAD
          elif [[ "$PUSH_BASE" =~ ^[0-9a-f]{40}$ && ! "$PUSH_BASE" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BASE}^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BASE" HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Check local Markdown links
        shell: bash
        run: bash scripts/check-docs.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Run protocol decoder fuzz smoke
        run: >-
          cargo test -p stellaris --lib --locked
          protocol::tests::arbitrary_input_is_handled_without_panicking -- --exact

      - name: Test vendored transport patches
        shell: bash
        run: |
          cargo fmt --manifest-path vendor/qunreliable/Cargo.toml -- --check
          cargo clippy --manifest-path vendor/qunreliable/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test --manifest-path vendor/qunreliable/Cargo.toml --locked
          cargo fmt --manifest-path vendor/qconnection/Cargo.toml -- --check
          cargo clippy --manifest-path vendor/qconnection/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test --manifest-path vendor/qconnection/Cargo.toml --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  backend-features:
    name: Transport compile / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - backend-quinn
          - backend-s2n
          - backend-gm-quic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.feature }}

      - name: Check core backend in isolation
        run: >-
          cargo check -p stellaris --all-targets --locked
          --no-default-features --features ${{ matrix.feature }}

      - name: Check CLI backend in isolation
        run: >-
          cargo check -p stellaris-cli --all-targets --locked
          --no-default-features --features ${{ matrix.feature }}

  native-build:
    name: Build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build the Quinn v2 runtime
        run: >-
          cargo build -p stellaris-cli --bin stellaris --release --locked
          --target ${{ matrix.target }} --no-default-features --features backend-quinn

      - name: Run Linux unit and integration tests
        if: runner.os == 'Linux'
        run: >-
          cargo test --workspace --locked --no-default-features --features backend-quinn
          --target ${{ matrix.target }}
