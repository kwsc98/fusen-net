name: Real TUN E2E

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Linux v2 native-only smoke or the complete release gate
        type: choice
        options: [native, all]
        default: native
        required: true

permissions:
  contents: read

concurrency:
  group: real-tun-linux-${{ inputs.scenario }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    runs-on: [self-hosted, Linux, X64, stellaris-tun]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - name: Run real TUN scenarios
        run: bash tests/e2e/run-real-tun.sh linux "${{ inputs.scenario }}"
