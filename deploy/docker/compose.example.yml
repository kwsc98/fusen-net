name: stellaris

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: stellaris/server:local
    command: ["server", "run", "--config", "/etc/stellaris/server.toml"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "7000:7000/udp"
      - "7001:7001/udp"
      - "7002:7002/udp"
    volumes:
      - ./server.toml:/etc/stellaris/server.toml:ro
      - ../../configs/nodes.example.toml:/etc/stellaris/nodes.toml:ro
      - server-state:/var/lib/stellaris
    secrets:
      - source: server_cert
        target: server_cert
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: server_key
        target: server_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      overlay-control:
        ipv4_address: 172.30.0.10
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

  agent:
    profiles: [agent]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    image: stellaris/agent:local
    command: ["agent", "run", "--config", "/etc/stellaris/agent.toml"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./agent.toml:/etc/stellaris/agent.toml:ro
      - agent-identity:/var/lib/stellaris
    secrets:
      - source: agent_ca
        target: agent_ca
        uid: "0"
        gid: "0"
        mode: 0444
      - source: agent_token
        target: agent_token
        uid: "0"
        gid: "0"
        mode: 0400
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    privileged: false
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - overlay-control
    depends_on:
      - server
    restart: unless-stopped

networks:
  overlay-control:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  server-state:
  agent-identity:

secrets:
  server_cert:
    file: ${STELLARIS_SERVER_CERT_FILE:-./secrets/server.pem}
  server_key:
    file: ${STELLARIS_SERVER_KEY_FILE:-./secrets/server-key.pem}
  agent_ca:
    file: ${STELLARIS_AGENT_CA_FILE:-./secrets/ca.pem}
  agent_token:
    file: ${STELLARIS_AGENT_TOKEN_FILE:-./secrets/edge-a.token}
